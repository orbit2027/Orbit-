<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7209b7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="150" cy="100" rx="110" ry="48" fill="none" stroke="url(#orbitGrad)" stroke-width="3" transform="rotate(-15 150 100)" stroke-dasharray="6,3" />

  <g class="mindmap-side">
    <line x1="55" y1="120" x2="90" y2="92" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="90" y1="92" x2="120" y2="108" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="55" cy="120" r="6" fill="#00d2ff" filter="url(#glow)" />
    <circle cx="90" cy="92" r="8" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="120" cy="108" r="5" fill="#00d2ff" />
  </g>

  <g class="core" transform="translate(150, 100)">
    <circle cx="0" cy="0" r="38" fill="url(#coreGlow)" />
    <path d="M-28 0 L28 0 M0 -28 L0 28" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <g class="kanban-side">
    <path d="M 175 96 Q 200 84, 225 72" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="3,2" />
    <rect x="192" y="65" width="22" height="15" rx="3" fill="#0077b6" stroke="#00b4d8" stroke-width="1.5" filter="url(#glow)" />
    <rect x="225" y="44" width="26" height="18" rx="4" fill="#7209b7" stroke="#f72585" stroke-width="1.5" filter="url(#glow)" />
  </g>
</svg>