<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi calendario — Orbit</title>
    <link rel="icon" type="image/svg+xml" href="../img/orbit-favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <script>
        (function () {
            document.documentElement.dataset.tema = localStorage.getItem('orbit_tema') || 'oscuro';
        })();
    </script>

    <link rel="stylesheet" href="../css/orbit.css">
    <link rel="stylesheet" href="../css/componentes.css">
    <link rel="stylesheet" href="../css/vistas.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/calendario.css">
</head>
<body>
<div class="layout-principal">

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <!-- ═══════════ CONTENIDO ═══════════ -->
    <div class="zona-contenido">

        <header class="topbar">
            <h1 class="topbar-titulo">Mi calendario</h1>

            <div class="calendario__navegacion">
                <button class="btn-zoom" id="cal-anterior" title="Mes anterior"><i class="bi bi-chevron-left"></i></button>
                <button class="btn-zoom ancho" id="cal-hoy">Hoy</button>
                <button class="btn-zoom" id="cal-siguiente" title="Mes siguiente"><i class="bi bi-chevron-right"></i></button>
            </div>

            <button class="campana-notificacion" id="campana-notificaciones"><i class="bi bi-bell"></i></button>
            <button class="avatar avatar--boton" id="avatar-topbar" type="button" aria-label="Abrir configuración de perfil" title="Mi perfil">U</button>

            <button class="btn-primary" id="btn-nueva-tarea-calendario">
                <i class="bi bi-plus"></i> Nueva tarea
            </button>
        </header>

        <div class="calendario__cuerpo">

            <!-- Vista de mes (FullCalendar) -->
            <div class="calendario__mes">
                <div id="calendario-mes"></div>
            </div>

            <!-- Panel lateral de agenda -->
            <aside class="calendario__agenda" id="calendario-agenda">
                <div class="calendario__agenda-cabecera">
                    <h3 id="agenda-fecha">Selecciona un día</h3>
                    <p id="agenda-resumen">Las tareas con fecha límite aparecerán aquí</p>
                </div>

                <div class="calendario__agenda-lista" id="agenda-lista"></div>

                <button class="btn-secondary calendario__agenda-agregar" id="agenda-agregar-tarea" style="display:none;">
                    <i class="bi bi-plus"></i> Agregar tarea a este día
                </button>
            </aside>
        </div>
    </div>
</div>

<!-- Modal: Crear tarea con fecha -->
<div class="modal-overlay" id="modal-tarea">
    <div class="glass-card-strong modal-card">
        <h3 class="modal-titulo" id="modal-tarea-titulo">Nueva tarea</h3>

        <div>
            <label class="etiqueta-form" for="tarea-titulo">Título de la tarea *</label>
            <input class="input-dark" id="tarea-titulo" placeholder="¿Qué necesitas hacer?">
        </div>

        <div>
            <label class="etiqueta-form" for="tarea-descripcion">Descripción (opcional)</label>
            <textarea class="input-dark" id="tarea-descripcion" rows="3" placeholder="Añade detalles..."></textarea>
        </div>

        <div>
            <label class="etiqueta-form">Etiqueta</label>
            <div class="calendario__opciones-etiqueta" id="opciones-etiqueta-modal"></div>
        </div>

        <div>
            <label class="etiqueta-form" for="tarea-fecha">Fecha límite</label>
            <input class="input-dark" type="date" id="tarea-fecha">
        </div>

        <div class="modal-acciones">
            <button class="btn-secondary" id="btn-cancelar-tarea">Cancelar</button>
            <button class="btn-primary" id="btn-guardar-tarea">Crear tarea</button>
        </div>
    </div>
</div>

<!-- FullCalendar, Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/es.global.min.js"></script>

<script type="module" src="../js/calendario.js"></script>
</body>
</html>
